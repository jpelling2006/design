<!DOCTYPE html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="override.css">
        <title>Out Of Office Message Editor</title>
    </head>
    <body>
        <br>

        <div class="container">
            <h1>Out of Office Message Editor</h1>
            <hr>
            <h2>Timing Management</h2>

            <div class="card">
                <fieldset id="dateRangeFieldset">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="dateRangeChecked">
                        <label class="form-check-label" for="dateRangeChecked">
                            Date Range:
                        </label>
                    </div>

                    <div id="dateRangePicker" class="mt-2 row">
                        <div class="col">
                            <label for="startDate">Start Date:</label>
                            <input type="date" id="startDate" class="form-control">
                        </div>
                        <div class="col">
                            <label for="endDate">End Date:</label>
                            <input type="date" id="endDate" class="form-control">
                        </div>
                    </div>
                </fieldset>

                <script>
                    document.addEventListener("DOMContentLoaded", function () {
                        const toggle = document.getElementById("dateRangeChecked");
                        const startDate = document.getElementById("startDate");
                        const endDate = document.getElementById("endDate");
                        const dateRangePicker = document.getElementById("dateRangePicker");

                        function updateDateFields() {
                            const isEnabled = toggle.checked;

                            startDate.disabled = !isEnabled;
                            endDate.disabled = !isEnabled;

                            // dim when disabled
                            dateRangePicker.style.opacity = isEnabled ? "1" : "0.5";
                        }

                        // run on page load
                        updateDateFields();

                        toggle.addEventListener("change", updateDateFields);
                    });
                </script>

                <!-- min today -->
                <script>
                    window.onload = function() {
                        let today = new Date().toISOString().split('T')[0];
                        document.getElementById('startDate').setAttribute('min', today);
                        document.getElementById('endDate').setAttribute('min', today);
                    };
                </script>

                <br>

                <fieldset>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" value="" id="timeRangeChecked">
                        <label class="form-check-label" for="timeRangeChecked">Time Range:</label>
                    </div>
                    <div id="timeRangePicker" class="mt-2 row">
                        <div class="col">
                            <label for="startTime">Start Time:</label>
                            <input type="time" id="startTime" class="form-control">
                        </div>
                        <div class="col">
                            <label for="endTime">End Time:</label>
                            <input type="time" id="endTime" class="form-control">
                        </div>
                    </div>
                </fieldset>

                <script>
                    document.addEventListener("DOMContentLoaded", function () {
                        const toggle = document.getElementById("timeRangeChecked");
                        const startTime = document.getElementById("startTime");
                        const endTime = document.getElementById("endTime");
                        const timeRangePicker = document.getElementById("timeRangePicker");

                        function updateTimeFields() {
                            const isEnabled = toggle.checked;

                            startTime.disabled = !isEnabled;
                            endTime.disabled = !isEnabled;

                            // dim the section when disabled
                            timeRangePicker.style.opacity = isEnabled ? "1" : "0.5";
                        }

                        // run on page load
                        updateTimeFields();

                        toggle.addEventListener("change", updateTimeFields);
                    });
                </script>

                <br>
                <fieldset>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" value="" id="dayRangeChecked">
                        <label class="form-check-label" for="dayRangeChecked">Days of Week:</label>
                    </div>
                    <div id="dayPicker" class="d-flex flex-wrap justify-content-start justify-content-md-center gap-3 mt-2">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="monCheckbox" value="mon">
                            <label class="form-check-label" for="monCheckbox">Mon</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="tueCheckbox" value="tue">
                            <label class="form-check-label" for="tueCheckbox">Tue</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="wedCheckbox" value="wed">
                            <label class="form-check-label" for="wedCheckbox">Wed</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="thuCheckbox" value="thu">
                            <label class="form-check-label" for="thuCheckbox">Thu</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="friCheckbox" value="fri">
                            <label class="form-check-label" for="friCheckbox">Fri</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="satCheckbox" value="sat" checked="">
                            <label class="form-check-label" for="satCheckbox">Sat</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="sunCheckbox" value="sun" checked="">
                            <label class="form-check-label" for="sunCheckbox">Sun</label>
                        </div>
                    </div>
                </fieldset>

                <script>
                    document.addEventListener("DOMContentLoaded", function () {
                        const toggle = document.getElementById("dayRangeChecked");
                        const dayPicker = document.getElementById("dayPicker");

                        const days = [
                            document.getElementById("monCheckbox"),
                            document.getElementById("tueCheckbox"),
                            document.getElementById("wedCheckbox"),
                            document.getElementById("thuCheckbox"),
                            document.getElementById("friCheckbox"),
                            document.getElementById("satCheckbox"),
                            document.getElementById("sunCheckbox")
                        ];

                        function updateDayFields() {
                            const isEnabled = toggle.checked;

                            days.forEach(day => day.disabled = !isEnabled);

                            dayPicker.style.opacity = isEnabled ? "1" : "0.5";
                        }

                        updateDayFields();
                        toggle.addEventListener("change", updateDayFields);
                    });
                </script>
            </div>

            <br>

            <h2>Message Editor</h2>

            <div class="card">
                <fieldset>
                    <div class="d-flex gap-2">
                        <select class="form-select" aria-label="Font select">
                            <option selected>Arial</option>
                            <option value="1">Times New Roman</option>
                            <option value="2">Monocraft</option>
                            <option value="3">Consolas</option>
                        </select>
                        <input type="number" class="form-control" id="spinner" value="11" min="1" max="250" step="1">
                    </div>
                </fieldset>
                
                <br>

                    </svg>
                </div>

                <br>

                <fieldset>
                    <div class="form-floating">
                        <textarea class="form-control" style="height: 200px; font-family:Arial; font-size:11pt" id="textArea">Thank you for your message. I am out of the office until 22/06/2026.
Diolch am eich neges. Rwrf allan o'r swyddfa tan 22/06/2026.
                    </textarea>
                    <label for="textArea">Out of Office Message</label>
                    </div>
                </fieldset>
            </div>

            <br>

            <div class="d-flex justify-content-end flex-column flex-sm-row gap-2">
                <button class="btn btn-success p-2">Save</button>
                <button class="btn btn-danger p-2">Cancel</button>
            </div>
        </div>
    </body>
</html>
