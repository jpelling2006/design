    <head>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="override.css">
        <title>Out Of Office Message Editor</title>
    </head>
    <body>
        <br>

        <div class="container">
            <h1>Out of Office Message Editor</h1>
            <hr>
            <h2>Timing Management</h2>

            <div class="card bg-light">
                <!-- <fieldset id="expiryFielset">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="expiryChecked">
                        <label class="form-check-label" for="expiryChecked">
                            Expires On:

                    </div>

                    <div id="expiryPicker" class="mt-2 row">
                        <div class="col">

                            <input type="date" id="expiry" class="form-control">
                        </div>
                    </div>
                </fieldset>

                <br> -->

                <fieldset id="dateRangeFieldset">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="dateRangeChecked">
                        <label class="form-check-label" for="dateRangeChecked">
                            Date Range:
                        </label>
                    </div>

                    <div id="dateRangePicker" class="mt-2 row">
                        <div class="col">
                            <label for="startDate">Start Date:</label>
                            <input type="date" id="startDate" class="form-control">
                        </div>
                        <div class="col">
                            <label for="endDate">End Date:</label>
                            <input type="date" id="endDate" class="form-control">
                        </div>
                    </div>
                </fieldset>

                <!-- min today -->
                <script>
                    window.onload = function() {
                        let today = new Date().toISOString().split('T')[0];
                        document.getElementById('startDate').setAttribute('min', today);
                        document.getElementById('endDate').setAttribute('min', today);

                        document.getElementById('startDate').addEventListener('input', function(){
                            let startDateValue = document.getElementById('startDate').value;
                            if (startDateValue) {
                                document.getElementById('endDate').setAttribute('min', startDateValue);
                            }
                        });
                    };
                </script>

                <br>

                <!-- no min here bc the timings can go over midnight -->
                <fieldset>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" value="" id="timeRangeChecked">
                        <label class="form-check-label" for="timeRangeChecked">Time Range:</label>
                    </div>
                    <div id="timeRangePicker" class="mt-2 row">
                        <div class="col">
                            <label for="startTime">Start Time:</label>
                            <input type="time" id="startTime" class="form-control">
                        </div>
                        <div class="col">
                            <label for="endTime">End Time:</label>
                            <input type="time" id="endTime" class="form-control">
                        </div>
                    </div>
                </fieldset>

                <br>
                <fieldset>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" value="" id="dayRangeChecked">
                        <label class="form-check-label" for="dayRangeChecked">Days of Week:</label>
                    </div>
                    <div id="dayPicker" class="d-flex flex-wrap justify-content-start justify-content-md-center gap-3 mt-2">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="monCheckbox" value="mon">
                            <label class="form-check-label" for="monCheckbox" id="monLabel">Mon</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="tueCheckbox" value="tue">
                            <label class="form-check-label" for="tueCheckbox" id="tueLabel">Tue</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="wedCheckbox" value="wed">
                            <label class="form-check-label" for="wedCheckbox" id="wedLabel">Wed</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="thuCheckbox" value="thu">
                            <label class="form-check-label" for="thuCheckbox" id="thuLabel">Thu</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="friCheckbox" value="fri">
                            <label class="form-check-label" for="friCheckbox" id="friLabel">Fri</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="satCheckbox" value="sat" checked="">
                            <label class="form-check-label" for="satCheckbox" id="satLabel">Sat</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="sunCheckbox" value="sun" checked="">
                            <label class="form-check-label" for="sunCheckbox" id="sunLabel">Sun</label>
                        </div>
                    </div>
                </fieldset>

                <script>
                    document.addEventListener("DOMContentLoaded", function () {
                    // Date Range
                    const dateToggle = document.getElementById("dateRangeChecked");
                    const startDate = document.getElementById("startDate");
                    const endDate = document.getElementById("endDate");
                    const dateRangePicker = document.getElementById("dateRangePicker");

                    function updateDateFields() {
                        const isEnabled = dateToggle.checked;
                        startDate.disabled = !isEnabled;
                        endDate.disabled = !isEnabled;
                        dateRangePicker.style.display = isEnabled ? "flex" : "none";
                    }
                    updateDateFields();
                    dateToggle.addEventListener("change", updateDateFields);

                    // Time Range
                    const timeToggle = document.getElementById("timeRangeChecked");
                    const startTime = document.getElementById("startTime");
                    const endTime = document.getElementById("endTime");
                    const timeRangePicker = document.getElementById("timeRangePicker");

                    function updateTimeFields() {
                        const isEnabled = timeToggle.checked;
                        startTime.disabled = !isEnabled;
                        endTime.disabled = !isEnabled;
                        timeRangePicker.style.display = isEnabled ? "flex" : "none";
                    }
                    updateTimeFields();
                    timeToggle.addEventListener("change", updateTimeFields);

                    // Days of Week
                    const dayToggle = document.getElementById("dayRangeChecked");

                    // Each individual checkbox element
                    const checkboxes = [
                        document.getElementById("monCheckbox"),
                        document.getElementById("tueCheckbox"),
                        document.getElementById("wedCheckbox"),
                        document.getElementById("thuCheckbox"),
                        document.getElementById("friCheckbox"),
                        document.getElementById("satCheckbox"),
                        document.getElementById("sunCheckbox"),
                        document.getElementById("monLabel"),
                        document.getElementById("tueLabel"),
                        document.getElementById("wedLabel"),
                        document.getElementById("thuLabel"),
                        document.getElementById("friLabel"),
                        document.getElementById("satLabel"),
                        document.getElementById("sunLabel")
                    ];

                    function updateDayFields() {
                        const isEnabled = dayToggle.checked;
                        // Hide or show individual checkboxes
                        checkboxes.forEach(checkbox => {
                            checkbox.style.display = isEnabled ? "inline-block" : "none";
                        });
                    }

                    updateDayFields();
                    dayToggle.addEventListener("change", updateDayFields);
                });
                </script>
            </div>

            <br>

                <br>

                <fieldset>
                    <div class="form-floating">
                        <textarea class="form-control" style="height: 200px; font-family:Arial; font-size:11pt" id="textArea">Thank you for your message. I am out of the office until 22/06/2026.
Diolch am eich neges. Rwrf allan o'r swyddfa tan 22/06/2026.
                    </textarea>
                    <label for="textArea">Out of Office Message</label>
                    </div>
                </fieldset>
            </div>

            <br>

            <div class="d-flex justify-content-between w-100">
                <button class="btn btn-outline-primary">Help</button>
                <div class="d-flex gap-2">
                    <div class="d-flex justify-content-end flex-column flex-sm-row gap-2">
                        <button class="btn btn-success p-2" data-bs-toggle="modal" data-bs-target="#saveModal">Save</button>
                        <button class="btn btn-danger p-2" data-bs-toggle="modal" data-bs-target="#cancelModal">Cancel</button>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="saveModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                    
                        <div class="modal-header">
                            <h5 class="modal-title">Save Confirmation</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        
                        <div class="modal-body">
                            <p>Are you sure you want to save this message?</p>
                        </div>
                        
                        <div class="modal-footer">
                            <div class="d-flex justify-content-between w-100">
                                <button class="btn btn-outline-primary">Help</button>
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Save</button>
                                </div>
                            </div>
                        </div>
                    
                    </div>
                </div>
            </div>

            <div class="modal fade" id="cancelModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                    
                        <div class="modal-header">
                            <h5 class="modal-title">Cancel Confirmation</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        
                        <div class="modal-body">
                            <p>
                                Are you sure you want to cancel?<br>
                                Your changes won't be saved!
                            </p>
                        </div>
                        
                        <div class="modal-footer">
                            <div class="d-flex justify-content-between w-100">
                                <button class="btn btn-outline-primary">Help</button>
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Go Back</button>
                                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel Message Creation</button>
                                </div>
                            </div>
                        </div>
                    
                    </div>
                </div>
